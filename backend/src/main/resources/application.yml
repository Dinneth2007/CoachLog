spring:
  application:
    name: crick
  profiles:
    active: dev

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

crick:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-min-1234567890}
    expiration-ms: 86400000
  auth:
    registration-enabled: ${CRICK_REGISTRATION_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

ai:
  embedding:
    api-key: ${GEMINI_API_KEY:}
    api-url: https://generativelanguage.googleapis.com/v1beta
  chat:
    api-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}

parent:
  link:
    base-url: ${PARENT_LINK_BASE_URL:http://localhost:5173/parent}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/crick?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

crick:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    registration-enabled: ${CRICK_REGISTRATION_ENABLED:false}
